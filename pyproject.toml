[tool.poetry]
name = "autoporter"
version = "0.1.0"
description = "Convert dotnet to python projects"
authors = ["Jack Danger <git@jackdanger.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
openai = "^1.51.0"
ollama = "^0.3.3"
ipython = "^8.28.0"
boto3 = "^1.35.34"
torch = "^2.4.1"
transformers = "^4.45.2"
tqdm = "^4.66.5"
google-generativeai = "^0.8.3"
google-genai = "^0.3.0"
langchain = "^0.3.13"
langchain-community = "^0.3.12"
langchain-openai = "^0.2.13"
langchain-cli = "^0.0.35"
bs4 = "^0.0.2"
javalang = "^0.13.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
